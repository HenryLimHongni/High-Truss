[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-100k-c3-c4-c5-c6-comparison"
version = "2.0.0"
description = "Full-graph exact C3/C4/C5/C6 truss recommendation comparisons on MovieLens 100K"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
